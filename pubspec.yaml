name: hesab_hazrat
description: حساب‌وکتاب شخصی آفلاین با اتصال مستقیم به گوگل‌شیت
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
  shamsi_date: ^1.1.1
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
